function imp(text,sym){const R=csv(text);if(R.length<2)return{err:'Arquivo vazio.'};const H=R[0].map(h=>h.trim().toLowerCase()),rows=R.slice(1),ix=f=>H.findIndex(f);let out=[],note='';

// ---------- analytics ----------
function st(ts){ts=[...ts].sort((a,b)=>a.close<b.close?-1:a.close>b.close?1:0);const w=ts.filter(t=>t.pnl>0),l=ts.filter(t=>t.pnl<0),sm=a=>a.reduce((s,t)=>s+t.pnl,0),gw=sm(w),gl=-sm(l),n=ts.length;let eq=0,pk=0,dd=0,ddp=0,c1=0,m1=0,c2=0,m2=0;const cv=[];

function insGroupTable(title,ts,fn){const rows=insGroupRows(ts,fn),minimum=insRules().minGroup;return `<section class="insight-breakdown"><h3>${esc(title)}</h3>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Grupo</th><th>Trades</th><th>P&L líquido</th><th>Expectancy</th><th>Amostra</th></tr></thead><tbody>${rows.map(g=>`<tr><td>${esc(g.name)}</td><td>${g.n}</td><td class="${cl(g.net)}">${money(g.net)}</td><td>${money(g.ex)}</td><td>${g.n<minimum?'Insuficiente para insights':g.n<30?'Exploratória':'Descritiva'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mu">Sem registros para este agrupamento.</p>'}</section>`}
function insDetailed(ts,model,win){const s=model.s,pr=model.process,bd=grp(ts,t=>isoW(new Date(day(t)+'T12:00'))),weeks=Object.entries(bd).sort((a,b)=>b[1].net-a[1].net),plan=ts.filter(t=>t.behavior?.plan===true),outside=ts.filter(t=>t.behavior?.plan===false),tol=model.rules.breakeven;return `<details class="card insight-details" id="ins-detailed"><summary>Análise detalhada <span>Métricas, cobertura e operações</span></summary><div class="insight-detail-body"><div class="secondary-metrics">${metric('P&L líquido',s.n?money(s.net):'—')}${metric('Expectancy em R',s.avgR==null?'—':insNum(s.avgR)+'R','',`${s.rn}/${s.n} trades com risco planejado informado`)}${metric('Payoff médio',s.w&&s.l?insNum(s.aw/s.al):'—','','Ganho médio ÷ perda média')}${metric('Sequência de ganhos / perdas',s.n?s.mcw+' / '+s.mcl:'—')}${metric('Dentro do plano',plan.length?money(st(plan).net):'—','',plan.length+' trades registrados')}${metric('Fora do plano',outside.length?money(st(outside).net):'—','',outside.length+' trades registrados')}${metric('Melhor semana do recorte',weeks.length?money(weeks[0][1].net):'—','',weeks[0]?.[0]||'')}${metric('Pior semana do recorte',weeks.length?money(weeks.at(-1)[1].net):'—','',weeks.at(-1)?.[0]||'')}${metric('Breakeven operacional',s.n?s.operationalBE:'—','',`|P&L| ≤ ${money(tol)}; não altera os resultados financeiros`)}${metric('Comissões / spread / slippage','—','','Custos não armazenados separadamente; não descontados outra vez')}</div><p class="muted-note">Disciplina: ${pr.complete}/${s.n} trades avaliáveis (${insNum(pr.coverage*100,0)}% de cobertura). Só há nota com todos os critérios ativos respondidos e cobertura mínima de 60%. A execução usa entrada, risco e saída; cumprimento do plano usa seu registro explícito. Regras têm pesos iguais; P&L e win rate não entram na nota.</p><h3>Evolução da disciplina por dia</h3><div class="discipline-days">${Object.entries(grp(ts,day)).map(([date,g])=>{const p=insProcess(g.ts);return `<div><span>${date}</span><b>${p.score===null?'Dados insuficientes':insNum(p.score,0)+'/100'}</b><small>${p.complete}/${g.n} trades avaliáveis</small></div>`}).join('')||'<p class="mu">Sem operações.</p>'}</div>${insGroupTable('Performance por ativo',ts,t=>t.symbol)}${insGroupTable('Performance por setup',ts,t=>t.setup)}${insGroupTable('Performance por sessão de entrada',ts,t=>t.open?sess(t):'')}${insGroupTable('Performance por horário de entrada',ts,t=>t.open?t.open.slice(11,13)+':00':'')}<p class="muted-note">Sessões usam a convenção de horários existente. Operações sem abertura registrada não são agrupadas por sessão ou horário de entrada.</p><h3>Classificação de setup registrada</h3><p class="muted-note">${['A','B','C'].map(g=>g+': '+ts.filter(t=>t.behavior?.grade===g).length).join(' · ')} · Não informada: ${ts.filter(t=>!['A','B','C'].includes(t.behavior?.grade)).length}. A classificação é declarada pelo trader; não é inferida do P&L.</p><h3>Operações analisadas</h3><div class="table-wrap">${tbl(ts)||'<p class="mu">Nenhuma operação no recorte.</p>'}</div><p class="muted-note">Selecione uma operação para revisar execução, notas e prints. Os registros usam a data de fechamento, sem nova conversão de fuso. R usa o risco monetário originalmente informado. P&L estimado continua marcado com *.</p></div></details>`}
function insRuleForm(){const r=insRules();return `<details class="card insight-details"><summary>Minhas regras operacionais <span>Personalizar a avaliação de processo</span></summary><form class="insight-detail-body" onsubmit="event.preventDefault();insSaveRules()"><p class="muted-note">Ative os critérios que fazem parte do seu plano e descreva suas regras. O cumprimento é declarado no trade; somente os limites numéricos abaixo são verificados automaticamente. Alterações recalculam os relatórios históricos, sem modificar operações.</p><div class="insight-rule-list">${INS_CRITERIA.map(([k,l])=>`<label class="ins-rule"><span><input type="checkbox" id="ir-${k}" ${r.enabled.includes(k)?'checked':''}> ${esc(l)}</span><input aria-label="Regra: ${esc(l)}" id="ir-text-${k}" maxlength="180" value="${esc(r.texts[k])}"></label>`).join('')}</div><div class="fg insight-limits"><label>Máximo de trades fechados por dia<input id="ir-daily" type="number" min="1" step="1" value="${r.dailyMax||''}" placeholder="Sem limite definido"></label><label>Máximo de risco informado por trade<input id="ir-riskmax" type="number" min="0.01" step="any" value="${r.riskMax||''}" placeholder="Moeda da conta"></label><label>Faixa de breakeven operacional (±)<input id="ir-be" type="number" min="0" step="any" value="${r.breakeven}"></label><label>Amostra mínima por grupo<input id="ir-sample" type="number" min="5" max="1000" step="1" value="${r.minGroup}"></label></div><p class="muted-note">O limite diário considera todos os trades da conta, inclusive os ocultos por filtros; somente as operações posteriores ao limite são sinalizadas. Risco ausente nunca implica risco respeitado. A faixa de breakeven é uma classificação operacional adicional; P&L, win rate e fórmulas financeiras existentes continuam usando zero exato.</p><button class="b" type="submit">Salvar regras</button><p id="ins-rule-status" class="muted-note" role="status"></p></form></details>`}
function insSaveRules(){const enabled=INS_CRITERIA.filter(([k])=>$('#ir-'+k).checked).map(([k])=>k);if(!enabled.length){$('#ins-rule-status').textContent='Ative pelo menos um critério para calcular a disciplina.';return}const daily=$('#ir-daily').value,risk=$('#ir-riskmax').value,be=Number($('#ir-be').value),sample=Number($('#ir-sample').value);if((daily&&(!Number.isInteger(+daily)||+daily<1))||(risk&&(!Number.isFinite(+risk)||+risk<=0))||!Number.isFinite(be)||be<0||!Number.isInteger(sample)||sample<5||sample>1000){$('#ins-rule-status').textContent='Revise os limites e os valores mínimos indicados.';return}S.insightRules={enabled,texts:Object.fromEntries(INS_CRITERIA.map(([k,l])=>[k,$('#ir-text-'+k).value.trim()||l])),dailyMax:daily?+daily:null,riskMax:risk?+risk:null,breakeven:be,minGroup:sample};save();R();const form=$('#ins-rule-status');if(form){form.closest('details').open=true;form.textContent='Regras salvas. Os relatórios foram recalculados.'}}
function vInsights(){const omitted=S.trades.length-insUniverse().length,w=insWindows(),pool=insFiltered(),ts=w.empty?[]:pool.filter(t=>day(t)>=w.from&&day(t)<=w.to),previous=w.empty?[]:pool.filter(t=>day(t)>=w.previous.from&&day(t)<=w.previous.to),model=insAnalysis(ts,previous,w),s=model.s,p=model.process,pct=w.empty?null:insPercent(w.from,ts),rtext=s.totR==null?'R indisponível':insNum(s.totR)+'R',ret=pct==null?'% indisponível':insNum(pct)+'%',rnote=`${s.rn}/${s.n} trades com risco informado`,discipline=p.score==null?'Dados insuficientes':insNum(p.score,0)+'/100';let cards='';
if(IV.mode==='day')cards=insCard('Resultado do dia',rtext+' · '+ret,rnote,'R = soma de P&L ÷ risco dos trades com risco informado. Percentual = P&L do recorte ÷ saldo de abertura calculado da conta; requer saldo inicial confirmado.')+insCard('Quantidade de operações',String(s.n),'Trades fechados no recorte')+insCard('Cumprimento do plano',insPct(p.plan.value),`${p.plan.n}/${s.n} trades com plano avaliado`,'Proporção de operações explicitamente dentro do plano; cobertura mínima de 60%.')+insCard('Qualidade de execução',p.execution.value==null?'Dados insuficientes':insNum(p.execution.value,0)+'/100',`${p.execution.n}/${s.n} trades avaliáveis`,'Média dos critérios de entrada, risco e saída; não usa resultados financeiros.');
if(IV.mode==='week')cards=insCard('Resultado semanal',rtext+' · '+ret,rnote)+insCard('Win rate',s.n?insNum(s.wr,1)+'%':'—',`${s.w} ganhos · ${s.l} perdas · ${s.n-s.w-s.l} zeros`)+insCard('Expectancy / trade',s.n?money(s.ex):'—','Média do P&L líquido por operação')+insCard('Disciplina operacional',discipline,`${p.complete}/${s.n} trades avaliáveis`)+insCard('Quantidade de trades',String(s.n),'Operações no recorte')+insCard('Comparação de P&L',s.n&&model.prev.n?money(s.net-model.prev.net):'Dados insuficientes',`${model.prev.n} trades no período anterior`,'Diferença entre resultados líquidos de janelas equivalentes; não prova evolução por si só.');
if(IV.mode==='month')cards=insCard('Rentabilidade líquida',s.n?money(s.net):'—',ret,'P&L líquido registrado; % usa saldo de abertura confirmado da conta.')+insCard('Resultado em R',s.totR==null?'—':insNum(s.totR)+'R',rnote)+insCard('Drawdown máximo',s.n?money(s.dd):'—','Queda do pico de P&L no recorte')+insCard('Win rate',s.n?insNum(s.wr,1)+'%':'—','Fórmula financeira existente')+insCard('Profit factor',s.n&&(s.w||s.l)?(isFinite(s.pf)?insNum(s.pf):'∞'):'—','Lucro bruto ÷ perda bruta')+insCard('Expectancy em R',s.avgR==null?'—':insNum(s.avgR)+'R',rnote)+insCard('Payoff médio',s.w&&s.l?insNum(s.aw/s.al):'—','Ganho médio ÷ perda média')+insCard('Quantidade de trades',String(s.n),'Operações no recorte');
const categories=[['strong','Pontos Fortes','O que funcionou'],['improve','Pontos de Melhoria','O que prejudicou a performance'],['attention','Pontos de Atenção','O que merece acompanhamento']];
return `<section class="card insight-toolbar"><div class="section-head"><div><div class="eyebrow">Processo antes do resultado</div><h2>Trading Insights</h2><p>Dados observados, decisões mais claras.</p></div><div class="insight-tabs" role="tablist" aria-label="Frequência do relatório">${[['day','Diário'],['week','Semanal'],['month','Mensal']].map(([k,l])=>`<button role="tab" tabindex="${IV.mode===k?0:-1}" aria-selected="${IV.mode===k}" aria-controls="ins-report" id="ins-tab-${k}" class="${IV.mode===k?'active':''}" onclick="insSetMode('${k}')" onkeydown="insTabKey(event,'${k}')">${l}</button>`).join('')}</div></div><div class="insight-period"><button class="b s" aria-label="Período anterior" onclick="insMove(-1)">‹</button><label>Data de referência<input type="date" aria-label="Data de referência dos insights" value="${IV.anchor}" onchange="if(insDate(this.value)){IV.anchor=this.value;R()}"></label><button class="b s" aria-label="Próximo período" onclick="insMove(1)">›</button><button class="b s" onclick="IV.anchor=ymd(new Date());R()">Hoje</button><button class="b s" onclick="insLatest()" ${ft().length?'':'disabled'}>Último trade</button><span class="muted-note">${w.empty?'Sem interseção com os filtros de data':w.from+' → '+w.to}<br>Respeita os filtros de data, ativo e estratégia.</span></div></section><div id="ins-report" role="tabpanel" aria-labelledby="ins-tab-${IV.mode}">${!s.n?`<div class="card insight-empty"><h3>${w.empty?'O período está fora do filtro de datas':'Nenhum trade neste período'}</h3><p>Escolha outra data, use “Último trade” ou ajuste os filtros acima. Nenhum resultado ou comportamento será presumido.</p></div>`:''}<div class="insight-metrics ${IV.mode==='day'?'daily':''}">${cards}</div><div class="insight-process-line"><span>Disciplina operacional <b>${discipline}</b></span><span>${p.complete}/${s.n} trades avaliáveis · critérios configuráveis · nota independente do P&L</span></div><div class="insight-columns">${categories.map(([k,title,monthly])=>{const item=model.selected.find(x=>x.category===k);return `<section class="card insight-block ${item?k:'neutral'}"><div class="eyebrow">${IV.mode==='month'?esc(monthly):esc(title)}</div><h3>${item?esc(item.title):'Evidência insuficiente'}</h3><p>${item?esc(item.text):k==='strong'?'Ainda não há registros suficientes para destacar um ponto forte.':k==='improve'?'Não há desvios suficientemente documentados para recomendar uma correção específica.':'Nenhum padrão de atenção sustentado pelos registros disponíveis.'}</p>${item?'<small>Base: registros do trader e cálculos determinísticos.</small>':''}</section>`}).join('')}</div><section class="card insight-focus"><div class="eyebrow">Próximo Foco</div><h3>${IV.mode==='month'?'Plano de melhoria para o próximo mês':IV.mode==='week'?'Prioridades para a próxima semana':'Sua próxima ação'}</h3><ol>${model.actions.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><button class="b s" onclick="$('#ins-detailed').open=true;$('#ins-detailed').scrollIntoView({behavior:'smooth',block:'start'})">Revisar registros do período</button></section>${IV.mode!=='day'?`<section class="card insight-evolution"><div class="eyebrow">Sua Evolução</div><h3>${IV.mode==='month'?'Em relação ao mês anterior':'Em relação à semana anterior'}</h3><p class="muted-note">${w.empty?'Sem período comparável':w.previous.from+' → '+w.previous.to+' versus '+w.from+' → '+w.to}. Mesmos ativos e estratégias; datas anteriores deslocadas para a janela equivalente. No período atual, compara somente os dias decorridos.</p><ul>${model.evolution.slice(0,5).map(e=>`<li class="${e.kind==='good'?'g':''}">${esc(e.text)}</li>`).join('')}</ul></section>`:''}<p class="muted-note insight-method">${omitted?omitted+' registro(s) no histórico sem data de fechamento ou P&L numérico válido foram excluídos desta análise; os dados originais foram preservados. ':''}${s.n&&s.n<10?'Amostra pequena: observações descritivas, sem conclusão sobre eficiência da estratégia. ':''}Sem IA externa: estatísticas e observações são calculadas localmente. Ausência de registro não significa ausência de erro. ${ts.some(t=>t.est)?'Este recorte contém P&L estimado (*). ':''}R e disciplina podem ter coberturas diferentes; confira os denominadores.</p>${insDetailed(ts,model,w)}${insRuleForm()}</div>`}
function insTabKey(event,key){if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const modes=['day','week','month'];IV.mode=event.key==='Home'?'day':event.key==='End'?'month':modes[(modes.indexOf(key)+(event.key==='ArrowRight'?1:2))%3];R();$('#ins-tab-'+IV.mode).focus()}

function insBehaviorForm(){const b=cur.behavior||{},r=insRules();return `<details class="behavior-panel" ${Object.keys(b).length?'open':''}><summary>Execução e disciplina <span>Opcional · seleções rápidas</span></summary><p class="muted-note">Este registro melhora os insights. Responda apenas o que sabe: “Não avaliado” não conta como “Sim”. O setup, emoção, observações e prints usam os campos já existentes.</p><div class="quick-criteria">${INS_CRITERIA.map(([k,l,q])=>`<fieldset><legend title="${esc(r.texts[k])}">${esc(q)}</legend><small>${esc(r.texts[k])}</small><div class="quick-options">${[['','Não avaliado'],['yes','Sim'],['no','Não']].map(([v,label])=>`<label><input type="radio" name="ib-${k}" value="${v}" ${(b[k]===true?'yes':b[k]===false?'no':'')===v?'checked':''}><span>${label}</span></label>`).join('')}</div></fieldset>`).join('')}<fieldset><legend>Classificação do setup</legend><div class="quick-options">${[['','Não avaliado'],['A','A'],['B','B'],['C','C']].map(([v,l])=>`<label><input type="radio" name="ib-grade" value="${v}" ${(b.grade||'')===v?'checked':''}><span>${l}</span></label>`).join('')}</div></fieldset></div><fieldset class="quick-errors"><legend>Erros registrados</legend><input id="ib-errors-reviewed" type="hidden" value="${Array.isArray(b.errors)?'yes':''}"><div class="quick-options">${INS_ERRORS.map(([k,l])=>`<label><input type="checkbox" data-ins-error="${k}" ${b.errors?.includes(k)?'checked':''} onchange="$('#ib-errors-reviewed').value='yes';insErrorStatus()"><span>${l}</span></label>`).join('')}</div><div class="row"><button class="b s" type="button" onclick="insClearErrors(true)">Nenhum erro</button><button class="b s" type="button" onclick="insClearErrors(false)">Não avaliado</button><small id="ib-error-status">${Array.isArray(b.errors)?b.errors.length?'Erros selecionados':'Nenhum erro declarado':'Erros não avaliados'}</small></div></fieldset></details>`}

function insReadBehavior(){const behavior={...(cur.behavior||{})};for(const [k] of INS_CRITERIA){const value=$(`input[name="ib-${k}"]:checked`)?.value;delete behavior[k];if(value==='yes'||value==='no')behavior[k]=value==='yes'}const grade=$('input[name="ib-grade"]:checked')?.value;delete behavior.grade;if(['A','B','C'].includes(grade))behavior.grade=grade;delete behavior.errors;if($('#ib-errors-reviewed')?.value==='yes')behavior.errors=[...document.querySelectorAll('[data-ins-error]:checked')].map(e=>e.dataset.insError);return Object.keys(behavior).length?behavior:null}

// Share-calendar R sources: recorded net result, explicit net R, or price-only outcome.
function rNumber(value){if(typeof value==='number')return Number.isFinite(value)?value:null;if(typeof value==='string'&&/^[+-]?\d+(?:[.,]\d+)?$/.test(value.trim())){const n=Number(value.trim().replace(',','.'));return Number.isFinite(n)?n:null}return null}
function realizedTradeR(t){const pnl=rNumber(t.pnl),risk=rNumber(t.risk),explicit=rNumber(t.realizedR);if(pnl!==null&&risk!==null&&risk>0&&Number.isFinite(pnl/risk))return {value:pnl/risk,source:'net',reason:'P&L líquido ÷ risco monetário planejado'};if(explicit!==null)return {value:explicit,source:'recorded',reason:'R líquido realizado informado pelo trader'};const entry=rNumber(t.entry),stop=rNumber(t.stop),exit=rNumber(t.exit),dir=t.side==='long'?1:t.side==='short'?-1:0;if(entry!==null&&stop!==null&&exit!==null&&entry>0&&stop>0&&exit>0&&dir&&dir*(entry-stop)>0){const r=dir*(exit-entry)/Math.abs(entry-stop);if(Number.isFinite(r))return {value:r,source:'price',reason:'R por preço: saída real versus entrada e stop inicial; custos não descontados'}}const missing=[];if(entry===null)missing.push('entrada');if(stop===null)missing.push('stop inicial');if(exit===null)missing.push('saída real');if(!dir)missing.push('lado compra/venda');return {value:null,source:'missing',reason:missing.length?'Faltam '+missing.join(', ')+'. Alternativa: informe o R líquido realizado.':'Stop inválido para o lado registrado. Confira os níveis ou informe o R líquido realizado.'}}
function saveSharedTradeR(id,date){const trade=S.trades.find(t=>t.id===id),input=document.getElementById('share-r-'+id);if(!trade||!input)return;const raw=input.value.trim(),value=rNumber(raw);if(raw&&value===null){alert('Informe o R realizado: por exemplo 3, -1 ou 0.');return}if(raw)trade.realizedR=value;else delete trade.realizedR;save();drawSharePreview();openShareDay(date)}

function shareMonthTrades(){return S.trades.filter(t=>typeof t.close==='string'&&t.close.slice(0,7)===SC.month)}
function shareMissingTrades(){return shareMonthTrades().filter(t=>realizedTradeR(t).value===null)}
function openShareRiskSetup(){const dialog=$('#sharedlg'),missing=shareMissingTrades(),eligible=missing.filter(t=>rNumber(t.pnl)!==null);dialog.innerHTML=`<div class="section-head"><h2>Completar R do histórico</h2><button class="b s" onclick="$('#sharedlg').close()">Fechar ×</button></div><p>${missing.length} de ${shareMonthTrades().length} operações do mês precisam de dados para calcular R.</p><details class="share-risk-bulk"><summary>Usei o mesmo risco inicial em todas essas operações</summary><p class="muted-note">Informe o valor que você realmente arriscou por operação, na mesma moeda do P&L importado. Não use o ganho médio, a perda média nem o saldo da conta. Esta opção só é adequada se o risco inicial foi igual nos ${eligible.length} trades sem R e com P&L conhecido.</p><label>Risco inicial por trade<input id="share-common-risk" type="number" min="0.00000001" step="any" placeholder="Informe o risco real, em moeda da conta" oninput="previewShareCommonRisk()"></label><p id="share-risk-preview" class="muted-note" role="status"></p><label class="shot-review"><input id="share-risk-confirm" type="checkbox"> Confirmo que esse foi o risco inicial de todas as ${eligible.length} operações selecionadas.</label><button class="b" onclick="applyShareCommonRisk()" ${eligible.length?'':'disabled'}>Aplicar risco aos ${eligible.length} trades sem R</button><p id="share-risk-status" role="status"></p></details><h3>Ou informe o R realizado de cada operação</h3><p class="muted-note">Use esta opção se os riscos variavam. Você pode preencher vários registros de uma vez. Campos vazios são mantidos sem alteração.</p><form onsubmit="event.preventDefault();saveShareRBatch()"><div class="share-r-table">${missing.map((t,i)=>`<label><span>Trade ${i+1} · ${esc(t.close.replace('T',' '))}</span><input type="number" step="any" data-share-r-id="${esc(t.id)}" aria-label="R realizado do trade ${i+1}" placeholder="Ex.: 3, -1 ou 0"></label>`).join('')}</div><button class="b s" type="submit" ${missing.length?'':'disabled'}>Salvar R preenchidos</button><p id="share-batch-status" role="status"></p></form>`;if(!dialog.open)dialog.showModal()}

function embeddedShotRuntime(){if(shotRuntime)return shotRuntime;const payload=$('#ocr-embedded-assets');if(!payload)return null;const assets=JSON.parse(payload.textContent),decode=key=>Uint8Array.from(atob(assets[key]),c=>c.charCodeAt(0)),url=(key,type)=>URL.createObjectURL(new Blob([decode(key)],{type}));const prefix=new TextDecoder().decode(decode('core'))+`;const yfxLangs=${JSON.stringify({eng:assets.eng,por:assets.por})};const yfxFetch=self.fetch.bind(self);self.fetch=(input,options)=>{const path=typeof input==='string'?input:input.url;for(const [lang,base64] of Object.entries(yfxLangs)){if(path.includes('yfxlang/'+lang+'.traineddata'))return Promise.resolve(new Response(Uint8Array.from(atob(base64),c=>c.charCodeAt(0)),{status:200}))}return yfxFetch(input,options)};\n`;const worker=URL.createObjectURL(new Blob([prefix,decode('worker')],{type:'text/javascript'}));const script=document.createElement('script');script.textContent=new TextDecoder().decode(decode('library'));document.head.append(script);shotRuntime={workerPath:worker,corePath:url('core','text/javascript')+'#core.js',langPath:'yfxlang',workerBlobURL:false,cacheMethod:'none'};return shotRuntime}
async function decodeShotImage(file){const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('Não foi possível abrir esta imagem. Use PNG ou JPEG.'));i.src=url});if(img.naturalWidth*img.naturalHeight>24000000)throw new Error('Imagem muito grande. Use uma captura de até 24 megapixels.');const c=document.createElement('canvas'),scale=Math.min(1,2400/img.naturalWidth);c.width=img.naturalWidth*scale;c.height=img.naturalHeight*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}finally{URL.revokeObjectURL(url)}}
async function readPositionLabels(worker,canvas){const {width:w,height:h}=canvas,ctx=canvas.getContext('2d',{willReadFrequently:true}),img=ctx.getImageData(0,0,w,h),data=img.data,x0=Math.max(0,w-110),bands={red:[],green:[],gray:[]};for(const kind of Object.keys(bands)){let start=null;for(let y=0;y<=h;y++){let n=0;if(y<h)for(let x=x0;x<w;x++){const i=(y*w+x)*4,r=data[i],g=data[i+1],b=data[i+2];if(kind==='red'?r>150&&r>g*1.5&&g<150:kind==='green'?g>90&&g>r*1.4&&b>r*1.2:Math.abs(r-g)<8&&Math.abs(g-b)<8&&r>=90&&r<=180)n++}if(n>=24&&start===null)start=y;if(n<24&&start!==null){if(y-start>=8&&y-start<=44)bands[kind].push({top:start,bottom:y});start=null}}}
if(bands.red.length!==1||bands.green.length!==1)return {text:'',issues:[]};const a=bands.red[0],b=bands.green[0],gray=bands.gray.filter(g=>g.top>Math.min(a.bottom,b.bottom)&&g.bottom<Math.max(a.top,b.top));if(gray.length!==1)return {text:'',issues:['Níveis coloridos encontrados, mas a entrada cinza não está inequívoca.']};let redArea=0,greenArea=0;for(let y=Math.min(a.top,b.top);y<Math.max(a.bottom,b.bottom);y+=3)for(let x=Math.floor(w*.45);x<w-140;x+=3){const i=(y*w+x)*4,r=data[i],g=data[i+1],blue=data[i+2];if(r>g+8&&r>blue+5)redArea++;if(g>r+15&&blue>r+8)greenArea++}if(redArea<40||greenArea<40)return {text:'',issues:[]};await worker.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'0123456789.,'});const values=[],precisions=[];try{for(const band of [a,gray[0],b]){const c=document.createElement('canvas');c.width=110*4;c.height=(band.bottom-band.top+4)*4;const x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,c.width,c.height);const crop=ctx.getImageData(x0,Math.max(0,band.top-2),w-x0,band.bottom-band.top+4);for(let i=0;i<crop.data.length;i+=4){const pixelX=x0+(i/4)%crop.width,pixelY=Math.max(0,band.top-2)+Math.floor(i/4/crop.width),middle=(Math.min(h-1,Math.floor((band.top+band.bottom)/2))*w+pixelX)*4;let badge=false;for(const yy of [band.top,band.top+1,band.bottom-1]){const q=(yy*w+pixelX)*4;if(data[q]<210||data[q+1]<210||data[q+2]<210)badge=true}const bg=((band.top+1)*w+pixelX)*4,base=.2126*data[bg]+.7152*data[bg+1]+.0722*data[bg+2],lum=.2126*crop.data[i]+.7152*crop.data[i+1]+.0722*crop.data[i+2],intensity=badge&&pixelY>=band.top&&pixelY<band.bottom?255-Math.max(0,Math.min(1,(lum-base)/Math.max(1,255-base)))*255:255;crop.data[i]=crop.data[i+1]=crop.data[i+2]=intensity}const small=document.createElement('canvas');small.width=crop.width;small.height=crop.height;small.getContext('2d').putImageData(crop,0,0);x.imageSmoothingEnabled=true;x.drawImage(small,0,0,c.width,c.height);const res=await worker.recognize(c);let text=res.data.text.trim();cons async function shotLoadLibrary(){if(embeddedShotRuntime())return;if(globalThis.Tesseract)return;if(location.protocol==='file:')throw new Error('Para ler prints, abra o site por HTTP/HTTPS com a pasta vendor disponível. Veja o README.');await new Promise((resolve,reject)=>{const tag=document.createElement('script');tag.src='vendor/ocr/tesseract.min.js';const timer=setTimeout(()=>{tag.remove();reject(new Error('O leitor demorou para carregar. Use a versão com OCR embutido.'))},15000);tag.onload=()=>{clearTimeout(timer);resolve()};tag.onerror=()=>{clearTimeout(timer);tag.remove();reject(new Error('Arquivos de leitura indisponíveis. Use a versão com OCR embutido.'))};document.head.append(tag)})}
async function readTradingShot(file){if(!file)return;const run=++shotGeneration,trade=cur;if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>20*1024*1024){$('#shot-status').textContent='Use uma imagem PNG, JPEG ou WebP de até 20 MB.';return}const status=text=>{if(cur===trade&&run===shotGeneration&&$('#shot-status'))$('#shot-status').textContent=text};status('Abrindo imagem…');try{const canvas=await decodeShotImage(file);if(cur!==trade||run!==shotGeneration||!$('#dlg').open)return;cur.screenshotIntake=true;cur.img.push(canvas.toDataURL('image/jpeg',.85));thumbs();$('#shot-results').innerHTML='<p>Print aberto. Preparando identificação dos dados…</p><label class="shot-review"><input id="shot-reviewed" type="checkbox"> Conferi os dados antes de salvar</label>';status('Print aberto. Iniciando leitura…');await shotLoadLibrary();if(cur!==trade||run!==shotGeneration)return;if(!shotWorker)shotWorker=Tesseract.createWorker(['eng','por'],1,{workerPath:new URL('vendor/ocr/worker.min.js',location.href).href,corePath:new URL('vendor/ocr/core/',location.href).href,langPath:new URL('vendor/ocr/lang/',location.href).href,workerBlobURL:false,cacheMethod:'none',...(shotRuntime||{}),errorHandler:e=>status('Falha na leitura. O print continua anexado; tente novamente.'),logger:m=>status(m.status==='recognizing text'?'Lendo imagem… '+Math.round(m.progress*100)+'%':'Preparando o reconhecimento…')}).catch(e=>{shotWorker=null;throw e});const worker=await shotWorker;const result=await worker.recognize(canvas);if(cur!==trade||run!==shotGeneration||!$('#dlg').open)return;status('Verificando níveis coloridos da posição…');const levels=await readPositionLabels(worker,canvas);if(cur!==trade||run!==shotGeneration||!$('#dlg').open)return;const parsed=parseTradingShot(result.data.text+levels.text);parsed.issues.push(...levels.issues);const applied=[];for(const [key,value] of Object.entries(parsed.fields)){const input=$('#f_'+key);if(input&&input.value===''){input.value=value;applied.push(key)}}if(cur.isNew&&$('#f_side').value===cur.side){$('#f_side').value=parsed.fields.side||''}cur.shotEvidence={engine:'tesseract-7',confidence:Math.round(result.data.confidence),issues:parsed.issues};$('#shot-results').innerHTML=`<p>${applied.length} campo(s) preenchido(s). Confira os valores que serão salvos; campos já preenchidos foram preservados.</p><div class="shot-summary">${Object.entries(parsed.fields).map(([key,value])=>`<div><small>${esc(FL.find(f=>f[0]===key)?.[1]||key)}</small><b>${esc(key==='side'?($('#f_side').value==='long'?'Compra':$('#f_side').value==='short'?'Venda':'Não identificado'):($('#f_'+key)?.value??value))}</b></div>`).join('')}</div>${parsed.issues.map(t=>`<p class="mu">${esc(t)}</p>`).join('')}<label class="shot-review"><input id="shot-reviewed" type="checkbox"> Conferi os campos reconhecidos com o print</label>`;$('#trade-technical').open=false;thumbs();status('Leitura concluída. Sem fechamento e P&L realizado, salve como planejamento.')}catch(e){shotWorker=null;status((e.message||'Não foi possível ler os dados.')+' O print permanece anexado. Você pode salvar o planejamento e revisar os campos.')}}
function saveShotDraft(){if(cur.screenshotIntake&&!$('#shot-reviewed')?.checked){alert('Confira os campos reconhecidos e marque a confirmação.');return}const o=shotReadFields();o.symbol=o.symbol.trim().toUpperCase();delete o.isNew;delete o.draftId;o.status='planned';S.tradeDrafts=Array.isArray(S.tradeDrafts)?S.tradeDrafts:[];const i=S.tradeDrafts.findIndex(t=>t.id===o.id);if(i>=0)S.tradeDrafts[i]=o;else S.tradeDrafts.push(o);save();shotGeneration++;$('#dlg').close();R()}
function editShotDraft(id){const draft=(S.tradeDrafts||[]).find(t=>t.id===id);if(!draft)return;edit(null);cur=JSON.parse(JSON.stringify(draft));cur.isNew=true;cur.draftId=id;cur.screenshotIntake=true;$('#shot-results').innerHTML='<label class="shot-review"><input id="shot-reviewed" type="checkbox"> Conferi os dados antes de salvar</label>';FL.forEach(([k])=>$('#f_'+k).value=cur[k]??'');$('#f_notes').value=cur.notes||'';$('#f_lesson').value=cur.lesson||'';$('.behavior-panel').outerHTML=insBehaviorForm();$('#trade-technical').open=true;thumbs();$('#shot-status').textContent='Planejamento recuperado. Para registrar o encerramento, informe o P&L realizado e o fechamento.'}
